name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --all-targets
      - run: sudo mkdir -p /etc/certferry/live /etc/certferry/renewal-hooks/deploy /var/log/certferry
      - run: sudo chmod -R 777 /etc/certferry /var/log/certferry
      - run: sudo sysctl net.ipv4.ip_unprivileged_port_start=443
      - run: cargo test -- --test-threads=1
      - run: cargo clippy -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Strip and check the binary is static
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/certferry
          strip $BIN
          file $BIN | grep -E 'static(-pie)? linked'
      - uses: actions/upload-artifact@v4
        with:
          name: certferry-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/certferry

  release-rpm:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: almalinux:8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: certferry-x86_64-linux-musl
      - run: dnf install -y rpm-build
      - run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x certferry
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp certferry ~/rpmbuild/BUILD/
          cp src/certferry-renew.service ~/rpmbuild/BUILD/
          cp src/certferry-renew.timer ~/rpmbuild/BUILD/
          rpmbuild -bb --define "_version $VERSION" pkg/certferry.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm certferry-${VERSION}.el8.x86_64.rpm
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.rpm"

  release-deb:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: certferry-x86_64-linux-musl
      - run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x certferry
          mkdir -p staging/usr/bin staging/usr/lib/systemd/system staging/DEBIAN
          cp certferry staging/usr/bin/
          sed 's|%CERTFERRY_EXE%|/usr/bin/certferry|g' src/certferry-renew.service > staging/usr/lib/systemd/system/certferry-renew.service
          cp src/certferry-renew.timer staging/usr/lib/systemd/system/
          sed "s/VERSION/$VERSION/" pkg/deb/DEBIAN/control > staging/DEBIAN/control
          # xz instead of Ubuntu's default zstd, which older Debian dpkg can't unpack
          dpkg-deb -Zxz --root-owner-group --build staging certferry_${VERSION}_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"

  release-tarball:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: certferry-x86_64-linux-musl
      - run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x certferry
          tar czf certferry-${VERSION}-x86_64-linux.tar.gz --owner=0 --group=0 certferry
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
